<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quote-box">
        <h2>Quote of the Day</h2>
        <blockquote id="quote">Loading...</blockquote>
        <span id="author">Loading...</span>
        <div>
            <button onclick="getQuote()">New Quote</button>
            <button onclick="tweet()">
                <img src="twitter.png" alt="Tweet"> Tweet
            </button>
        </div>
    </div>

    <script>
        const quoteElement = document.getElementById("quote");
        const authorElement = document.getElementById("author");
        const apiUrl = "https://api.api-ninjas.com/v1/quotes";
        const apiKey = "UTcgY1RDgfsnfJp8z2cr7w==ZRqXYs3pR2hyPsDm";

        async function getQuote() {
            try {
                const response = await fetch(apiUrl, {
                    headers: { 'X-Api-Key': apiKey }
                });
                const data = await response.json();
                const quote = data[0];
                quoteElement.innerHTML = `"${quote.quote}"`;
                authorElement.innerHTML = `- ${quote.author}`;
            } catch (error) {
                quoteElement.innerHTML = "Oops! Something went wrong.";
                authorElement.innerHTML = "";
                console.error("Error fetching quote:", error);
            }
        }

        getQuote();

        function tweet() {
            const tweetText = `${quoteElement.innerHTML} --- ${authorElement.innerHTML}`;
            window.open(
                `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`,
                "Tweet Window",
                "width=600, height=300"
            );
        }
    </script>
</body>
</html>
